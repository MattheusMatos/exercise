name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    # 24.04: o Playwright 1.56 (o mesmo da máquina de desenvolvimento) não instala o Chromium no 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testes de lógica
        run: npm run test:unidade
      - name: Testes de tela
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
